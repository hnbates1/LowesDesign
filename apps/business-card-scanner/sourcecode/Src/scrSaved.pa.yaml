Screens:
  scrSaved:
    Properties:
      Fill: =Color.White
    Children:
      - rectSavedTop:
          Control: Rectangle
          Properties:
            Fill: =gblInk
            Height: =260
            Width: =Parent.Width

      - lblSavedCheck:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =Color.White
            Fill: =gblSuccess
            FontWeight: =FontWeight.Bold
            Height: =96
            RadiusBottomLeft: =48
            RadiusBottomRight: =48
            RadiusTopLeft: =48
            RadiusTopRight: =48
            Size: =42
            Text: ="✓"
            Width: =96
            X: =(Parent.Width - Self.Width) / 2
            Y: =92

      - lblSavedTitle:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =gblInk
            FontWeight: =FontWeight.Bold
            Height: =58
            Size: =28
            Text: =If(varSaveResult = "updated", "Contact updated", "Contact saved")
            Width: =Parent.Width - 64
            X: =32
            Y: =330

      - lblSavedName:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =gblTextSecondary
            Height: =80
            Size: =18
            Text: =vFullName & If(!IsBlank(vCompany), Char(10) & vCompany, "")
            Width: =Parent.Width - 64
            X: =32
            Y: =402

      - lblSavedMessage:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =gblTextSecondary
            Height: =90
            Size: =14
            Text: =If(varSaveResult = "updated", "The existing SharePoint contact was updated without overwriting fields the scan left blank.", "A new contact was added to the SharePoint list.")
            Width: =Parent.Width - 96
            X: =48
            Y: =520

      - btnScanAnother:
          Control: Button
          Properties:
            Color: =Color.White
            Fill: =gblAction
            FontWeight: =FontWeight.Bold
            Height: =64
            Size: =18
            Text: ="Scan another card"
            Width: =Parent.Width - 96
            X: =48
            Y: =690
            OnSelect: |-
              =Reset(btnCardPhoto);
              Set(varExisting, Blank());
              Set(varPrediction, Blank());
              Set(varSaveResult, "");
              Navigate(scrScan, ScreenTransition.Fade)

      - lblSavedFooter:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =gblTextSecondary
            Height: =60
            Size: =12
            Text: ="Lowe's business card scanner"
            Width: =Parent.Width - 64
            X: =32
            Y: =850
