            Set(vFullName, Trim(txtFirstName.Text & " " & txtLastName.Text));
            Set(vCompany, Trim(txtCompany.Text));
            Set(vJobTitle, Trim(txtJobTitle.Text));
            Set(vDepartment, Trim(txtDepartment.Text));
            Set(vEmail, Trim(txtEmail.Text));
            Set(vBusinessPhone, Trim(txtBusinessPhone.Text));
            Set(vMobilePhone, Trim(txtMobilePhone.Text));
