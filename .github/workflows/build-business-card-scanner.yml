name: Build Business Card Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/business-card-scanner
    paths:
      - 'apps/business-card-scanner/**'
      - '.github/workflows/build-business-card-scanner.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare unpacked canvas source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/pnp/powerapps-samples.git "$env:RUNNER_TEMP\powerapps-samples"
          $template = "$env:RUNNER_TEMP\powerapps-samples\samples\timer\sourcecode"
          $source = "$env:RUNNER_TEMP\business-card-scanner-source"
          Copy-Item $template $source -Recurse

          Remove-Item "$source\Src\*.fx.yaml" -Force
          if (Test-Path "$source\Src\EditorState") { Remove-Item "$source\Src\EditorState" -Recurse -Force }

          Copy-Item "apps\business-card-scanner\Src\*.fx.yaml" "$source\Src\"
          Copy-Item "apps\business-card-scanner\CanvasManifest.json" "$source\CanvasManifest.json" -Force
          Copy-Item "apps\business-card-scanner\ControlTemplates.json" "$source\ControlTemplates.json" -Force

          Copy-Item "$env:RUNNER_TEMP\powerapps-samples\samples\sharepoint-events\sourcecode\pkgs\addMedia_2.2.1.xml" "$source\pkgs\addMedia_2.2.1.xml"
          Copy-Item "$env:RUNNER_TEMP\powerapps-samples\samples\sharepoint-events\sourcecode\pkgs\text_2.3.1.xml" "$source\pkgs\text_2.3.1.xml"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$source\*" -DestinationPath "dist\LowesBusinessCardScanner-source.zip" -Force

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Pack msapp
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\business-card-scanner-source"
          pac canvas pack --sources "$source" --msapp "dist\LowesBusinessCardScanner.msapp" --layout Experimental --overwrite

      - name: Copy setup files
        shell: pwsh
        run: |
          Copy-Item "apps\business-card-scanner\README.md" "dist\README.md"
          Copy-Item "apps\business-card-scanner\sharepoint-columns.csv" "dist\sharepoint-columns.csv"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowesBusinessCardScanner
          path: dist/*
          if-no-files-found: error
